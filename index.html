<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      padding: 20px;
      background-color: #007BFF;
      color: white;
      margin: 0;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      max-width: 100px;
      height: auto;
      margin-bottom: 10px;
      border-radius: 12px;
    }
    .card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }
    .card p {
      font-size: 14px;
      color: #555;
      text-align: center;
    }
    .download-btn {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .download-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h1>App Store</h1>
  <div class="container" id="app-list"></div>  <script>
    fetch('http://localhost:5000/apps')
      .then(res => res.json())
      .then(apps => {
        const list = document.getElementById('app-list');
        apps.forEach(app => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
            <img src="http://localhost:5000/uploads/${app.logo}" alt="App Logo">
            <h3>${app.name}</h3>
            <p>${app.description}</p>
            <a class="download-btn" href="${app.apkLink}" target="_blank">Download</a>
          `;
          list.appendChild(div);
        });
      })
      .catch(err => {
        console.error('Error fetching apps:', err);
      });
  </script></body>
</html>
