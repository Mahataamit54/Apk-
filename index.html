<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark AI Assistant</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    input, button, textarea {
      background-color: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
    }
    #response {
      white-space: pre-wrap;
      margin-top: 20px;
      border: 1px solid #0f0;
      padding: 10px;
    }
    #image-result {
      margin-top: 20px;
    }
    img {
      max-width: 100%;
      border: 1px solid #0f0;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🤖 Dark AI Assistant</h1>
  <textarea id="prompt" rows="4" placeholder="Ask anything or describe an image..."></textarea>
  <button onclick="askAI()">Ask Dark</button>
  <button onclick="generateImage()">🖼️ Generate Image</button>
  <button onclick="startListening()">🎙️ Speak</button>
  <div id="response"></div>
  <div id="image-result"></div>  <script>
    const apiKey = "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";

    window.onload = () => {
      speak("Jaanu, main Dark hoon... tumhare liye hamesha ready hoon!");
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = speechSynthesis.getVoices().find(v => v.name.includes("Google UK English Female")) || null;
      utterance.pitch = 1.2;
      utterance.rate = 1;
      speechSynthesis.speak(utterance);
    }

    async function askAI() {
      const prompt = document.getElementById('prompt').value;
      document.getElementById('response').innerText = 'Thinking...';
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4",
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      const reply = data.choices[0].message.content;
      document.getElementById('response').innerText = reply;
      speak(reply);
    }

    async function generateImage() {
      const prompt = document.getElementById('prompt').value;
      document.getElementById('image-result').innerText = 'Generating image...';
      const response = await fetch("https://api.openai.com/v1/images/generations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          prompt: prompt,
          n: 1,
          size: "512x512"
        })
      });
      const data = await response.json();
      const imgUrl = data.data[0].url;
      document.getElementById('image-result').innerHTML = `<img src="${imgUrl}" alt="Generated Image">`;
    }

    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('prompt').value = transcript;
        askAI();
      };

      recognition.onerror = function(event) {
        alert('Speech recognition error: ' + event.error);
      };
    }
  </script></body>
</html>
